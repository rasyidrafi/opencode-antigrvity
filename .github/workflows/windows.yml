name: Native ACP compatibility

on:
  pull_request:
  push:
    branches: [main, pr2-integration, fix/windows-acp-compatibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: mkdir -p /tmp/opencode
      - run: bun ci
      - run: bun run check
  macos:
    # actions/runner-images lists macos-15 as ARM64; assert architecture in test.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: mkdir -p /tmp/opencode
      - run: bun ci
      - run: bun run build
      # Linux runs the complete suite; these platform jobs also exercise the
      # portable native-lock, tombstone, atomic-write and deletion-queue cases.
      - run: bun test test/agy-cli.test.ts test/windows-support.test.ts test/file-lock.test.ts test/atomic-write.test.ts test/deletion-recovery.test.ts test/bounded-retry-queue.test.ts test/acp-process.test.ts test/budget-config.test.ts test/plugin-entrypoint.test.ts test/usage-fallback.test.ts --timeout 30000
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: bun ci
      - run: bun run build
      # Process fixtures elsewhere use POSIX shebangs; native tests below
      # exercise Windows executables, filesystem, authentication and budgets.
      - run: bun test test/agy-cli.test.ts test/windows-support.test.ts test/file-lock.test.ts test/atomic-write.test.ts test/deletion-recovery.test.ts test/bounded-retry-queue.test.ts test/budget-config.test.ts test/plugin-entrypoint.test.ts --timeout 30000
